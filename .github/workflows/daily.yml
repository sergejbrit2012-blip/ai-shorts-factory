
name: AI Shorts Factory

on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * *'
    - cron: '30 10 * * *'
    - cron: '30 13 * * *'
    - cron: '30 16 * * *'
    - cron: '30 19 * * *'

jobs:
  create-short:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai_shorts_factory

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare YouTube authorization
        env:
          YOUTUBE_TOKEN_JSON_V2: ${{ secrets.YOUTUBE_TOKEN_JSON_V2 }}
        run: |
          if [ -z "$YOUTUBE_TOKEN_JSON_V2" ]; then
            echo "ERROR: YOUTUBE_TOKEN_JSON_V2 secret is missing"
            exit 1
          fi

          printf '%s' "$YOUTUBE_TOKEN_JSON_V2" > token.json
          echo "YouTube authorization file created"

      - name: Generate video
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          UPLOAD_TO_YOUTUBE: 'true'
          YOUTUBE_PRIVACY: 'private'
        run: |
          python src/generate.py

      - name: Upload generated files as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-shorts-output
          path: ai_shorts_factory/output/
          if-no-files-found: ignore
          retention-days: 7
