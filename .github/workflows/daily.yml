
name: AI Shorts Factory

on:
  workflow_dispatch:
     schedule:
    - cron: '30 7 * * *'
    - cron: '30 10 * * *'
    - cron: '30 13 * * *'
    - cron: '30 16 * * *'
    - cron: '30 19 * * *'
jobs:
  create-short:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai_shorts_factory

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare YouTube authorization
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON_V2 }}
        run: |
          python -c "import os,json; d=json.loads(os.environ['YOUTUBE_TOKEN_JSON']); print('TOKEN CHECK:', {k: bool(d.get(k)) for k in ['client_id','client_secret','refresh_token']}); open('token.json','w').write(json.dumps(d))"

      - name: Generate and upload Short
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          UPLOAD_TO_YOUTUBE: 'true'
          YOUTUBE_PRIVACY: 'private'
        run: |
          python src/generate.py
